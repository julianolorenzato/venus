[workspace]
members = ["codegen", "common", "compiler", "linker", "loader", "runtime", "vm"]

[package]
name = "venus"
version = "0.1.0"
edition = "2021"
description = "An environment to assemble and run Venus."
authors = ["Juliano Lorenzato <julianolorenzato@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { workspace = true }
compiler = { path = "./compiler" }

[workspace.dependencies]
assert_cmd = "2.0.16"
itertools = "0.14.0"
clap = { version = "4.5.17", features = ["derive"] }
regex = "1.11.1"
